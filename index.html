<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student card FORM</title>
</head>
<body>
  <h2><b>Student card FORM</b></h2>

  <h3><b>Personal Information</b></h3>
  <fieldset>
    <legend>Provide your details</legend>

    <label>Full Name: <input type="text" name="fullname" placeholder="Enter your full name"></label><br><br>
    <label>Email: <input type="email" name="email" placeholder="Enter your email"></label><br><br>
    <label>Password: <input type="password" name="password" placeholder="Enter a password"></label><br><br>
    <label>Age: <input type="number" name="age"></label><br><br>
    <label>Date of Birth: <input type="date" name="dob"></label><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male<br>
    <input type="radio" name="gender" value="female"> Female<br>
    <input type="radio" name="gender" value="other"> Other<br><br>

    <label>Languages Known:</label><br>
    <input type="checkbox" name="lang" value="english"> English<br>
    <input type="checkbox" name="lang" value="spanish"> Spanish<br>
    <input type="checkbox" name="lang" value="french"> French<br><br>

    <label>Country:
      <select name="country">
        <option>Select your country</option>
        <option>Ukraine</option>
        <option>Poland</option>
        <option>Germany</option>
      </select>
    </label>
  </fieldset>

  <h3><b>College Subjects</b></h3>
  <fieldset>
    <legend>Select your subjects</legend>

    <label>Choose subjects:</label><br>
    <select name="subjects" multiple size="4">
      <option>Mathematics</option>
      <option>Computer Science</option>
      <option>Physics</option>
      <option>Chemistry</option>
    </select><br><br>

    <label>Rate your interest in Computer Science:
      <input type="range" name="interest" min="0" max="10">
    </label>
  </fieldset>

  <h3><b>Skills Assessment</b></h3>
  <fieldset>
    <legend>Assess your skills</legend>

    <label>Describe your skills:</label><br>
    <textarea name="skills" rows="4" cols="50" placeholder="List your skills here..."></textarea><br><br>

    <label>Upload your resume:
      <input type="file" name="resume">
    </label><br><br>

    <label>Pick your favorite color:
      <input type="color" name="color">
    </label><br><br>

    <label>Preferred study time:
      <input type="time" name="study_time">
    </label><br><br>

    <input type="submit" value="Submit Survey">
  </fieldset>

  <p>© Student card by Vladyslav. All rights reserved.</p>
</body>
</html>
